apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-web-app
  template:
    metadata:
      labels:
        app: go-web-app
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: go-web-app
          image: revanthreddydatla/go-web-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          



